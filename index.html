<script>
  // pdf.js carregado sob demanda (só quando o usuário abre um PDF)
  window._pdfWorkerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  window._carregarPdfJs = function() {
    if (window._pdfJsLoading || typeof pdfjsLib !== 'undefined') return Promise.resolve();
    window._pdfJsLoading = true;
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = window._pdfWorkerSrc; res(); };
      s.onerror = rej;
      document.head.appendChild(s);
    });
  };
</script>
<script>
window.addEventListener('DOMContentLoaded',async()=>{
  let recarregando=false;
  const tinhaControle=!!navigator.serviceWorker?.controller;
  const limitar=(promessa,tempo)=>Promise.race([promessa,new Promise(resolve=>setTimeout(resolve,tempo))]);
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(!tinhaControle||recarregando)return;
        recarregando=true;window._bootQuadro.mostrar('abrindo seu quadro');location.reload();
      });
      const registro=await limitar(navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}),4000);
      if(registro){
        registro.addEventListener('updatefound',()=>{if(tinhaControle)window._bootQuadro.mostrar('atualizando');});
        await limitar(registro.update(),4000);
        const worker=registro.installing;
        if(worker){
          if(tinhaControle)window._bootQuadro.mostrar('atualizando');
          await limitar(new Promise(resolve=>{
            const verificar=()=>{if(['activated','redundant'].includes(worker.state)){worker.removeEventListener('statechange',verificar);resolve();}};
            worker.addEventListener('statechange',verificar);verificar();
          }),12000);
        }
      }
    }
    if(document.fonts)await limitar(document.fonts.ready,1000);
  }catch(erro){console.error('Erro ao atualizar o site:',erro);}
  finally{if(!recarregando)requestAnimationFrame(()=>requestAnimationFrame(()=>window._bootQuadro.esconder()));}
});
</script>
